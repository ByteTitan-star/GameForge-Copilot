name: Eval Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_fault:
        description: "Run reliability live-fault simulations"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: eval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security_eval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # When splitting PRs, early PRs may contain a partial dataset.
      # Keep CI gate green until the full security dataset lands.
      SECURITY_BLOCK_RATE_MIN: "0.80"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps
        run: uv sync --frozen --no-dev

      - name: Run security eval (quick_filter only)
        id: sec-eval
        run: |
          set -o pipefail
          OUT=$(PYTHONPATH=. uv run python scripts/ci_security_eval_quickfilter.py | tee /tmp/sec-eval.log)
          echo "$OUT" > /tmp/sec-eval.out

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-security-eval-report
          path: tmp/ci_security_eval_report.md
          if-no-files-found: error

      - name: PR comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'tmp/ci_security_eval_report.md';
            const report = fs.readFileSync(reportPath, 'utf8');
            const short = report.split('\n').slice(0, 25).join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Security Eval Gate\\n\\n\`\`\`\\n${short}\\n\`\`\`\\n`
            });

  offline_eval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps
        run: uv sync --frozen --no-dev

      - name: Run offline eval gate
        env:
          PYTHONPATH: .:..
        run: uv run python scripts/ci_offline_eval_gate.py

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-offline-eval-report
          path: tmp/ci_offline_eval_report.md
          if-no-files-found: error

  generation_eval:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps
        run: uv sync --frozen --no-dev

      - name: Run offline eval gate
        env:
          PYTHONPATH: .:..
        run: uv run python scripts/ci_offline_eval_gate.py

      - name: Run full offline eval orchestrator
        env:
          PYTHONPATH: .:..
        run: uv run python ../eval/run_all.py

      - name: Live generation eval (limit 10)
        env:
          EVAL_LIVE: "1"
          EVAL_API_BASE_URL: ${{ secrets.EVAL_API_BASE_URL }}
          EVAL_ACCESS_TOKEN: ${{ secrets.EVAL_ACCESS_TOKEN }}
          GENERATION_LIVE_SUCCESS_MIN: "0.90"
          PYTHONPATH: .:..
        run: |
          set -euo pipefail
          if [ -z "${EVAL_API_BASE_URL:-}" ] || [ -z "${EVAL_ACCESS_TOKEN:-}" ]; then
            echo "EVAL_API_BASE_URL and EVAL_ACCESS_TOKEN secrets are required for main live eval"
            exit 1
          fi
          uv run python -m eval.runners.generation_eval --live --limit 10
          # Derive #116/#117 from the just-written generation report when present.
          uv run python -m eval.runners.code_quality_eval || true
          uv run python -m eval.runners.performance_eval || true
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          reports = sorted(Path("../eval/reports").glob("*_generation_eval.json"), reverse=True)
          if not reports:
              print("no generation report found", file=sys.stderr)
              sys.exit(1)
          data = json.loads(reports[0].read_text(encoding="utf-8"))
          rate = float((data.get("summary") or {}).get("success_rate") or 0)
          minimum = float(os.environ.get("GENERATION_LIVE_SUCCESS_MIN", "0.90"))
          print(f"success_rate={rate:.4f} min={minimum:.4f} report={reports[0].name}")
          if rate < minimum:
              sys.exit(1)
          PY

      - name: Upload live generation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-live-generation-eval
          path: |
            eval/reports/*_generation_eval.json
            docs/evals/generation-eval-report.md
            docs/evals/code-quality-eval-report.md
            docs/evals/performance-eval-report.md
          if-no-files-found: warn

  reliability_live_fault:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_fault == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend deps
        run: uv sync --frozen --no-dev
      - name: Run reliability live-fault simulations
        env:
          PYTHONPATH: .:..
          EVAL_LIVE_FAULT: "1"
        run: uv run python -m eval.runners.reliability_eval --live-fault
