services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gameforge
      POSTGRES_PASSWORD: gameforge
      POSTGRES_DB: gameforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # 数据库数据
    healthcheck:    # 健康检查
      test: ["CMD-SHELL", "pg_isready -U gameforge -d gameforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data    # 缓存数据
    healthcheck:    # 健康检查
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: gameforge
      RABBITMQ_DEFAULT_PASS: gameforge
      # ADR-08: raise consumer_timeout so long code_qa runs are not force-closed (~2h)
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 7200000"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 本地免费 Embedding（TEI）：OpenAI 兼容 POST /v1/embeddings
  # 模型优先用本机目录 data/embedding-models（scripts/download_embedding_model.sh 预拉）；
  # 若目录不存在则回退到容器内从 HuggingFace 拉取（需能访问 huggingface.co）。
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    ports:
      - "8080:80"
    volumes:
      - embedding_data:/data
      - ./data/embedding-models:/data/models:ro
    command:
      - --model-id
      - /data/models/BAAI/bge-small-zh-v1.5
      - --served-model-name
      - BAAI/bge-small-zh-v1.5
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:80/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    # aiodocker 需访问 docker.sock；生产 K8s 用 sidecar/ DinD，勿长期 root
    user: "0:0"
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://gameforge:gameforge@postgres:5432/gameforge
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://gameforge:gameforge@rabbitmq:5672/
      MESSAGING_BACKEND: rabbitmq
      SANDBOX_BACKEND: docker
      SANDBOX_IMAGE: gameforge/sandbox:local
      BUILDER_BACKEND: docker
      BUILDER_IMAGE: gameforge-builder:v1
      PNPM_STORE_PATH: /var/cache/gameforge/pnpm-store
      HOSTING_ROOT: /data/hosting
    ports:
      - "8000:8000"
    volumes:
      - hosting:/data/hosting
      - pnpm_store:/var/cache/gameforge/pnpm-store
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:   # 依赖检查
      postgres:
        condition: service_healthy    # 数据库健康
      redis:
        condition: service_healthy    # 缓存健康
      rabbitmq:
        condition: service_healthy    # 消息队列健康

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    # 水平扩容：多副本竞争消费同一 TASK_QUEUE（RabbitMQ 负载均衡）。
    # docker compose up -d --scale worker=N 或设 WORKER_REPLICAS=N。
    # 单进程内并发另由 MAX_CONCURRENT_TASKS(prefetch) 控制；二者叠加为总并发。
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    user: "0:0"
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://gameforge:gameforge@postgres:5432/gameforge
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://gameforge:gameforge@rabbitmq:5672/
      MESSAGING_BACKEND: rabbitmq
      SANDBOX_BACKEND: docker
      SANDBOX_IMAGE: gameforge/sandbox:local
      BUILDER_BACKEND: docker
      BUILDER_IMAGE: gameforge-builder:v1
      PNPM_STORE_PATH: /var/cache/gameforge/pnpm-store
      HOSTING_ROOT: /data/hosting
    volumes:
      - hosting:/data/hosting
      - pnpm_store:/var/cache/gameforge/pnpm-store
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  sandbox:
    image: gameforge/sandbox:local
    build:
      context: ./docker
      dockerfile: Dockerfile.sandbox
    profiles: ["build-sandbox"]

  builder:
    image: gameforge-builder:v1
    build:
      context: .
      dockerfile: docker/Dockerfile.builder
    profiles: ["build-sandbox"]

volumes:
  pgdata:       # 数据库数据
  redisdata:    # 缓存数据
  hosting:      # 沙盒数据
  pnpm_store:   # shared pnpm store（构建链 §9.1）
  embedding_data:  # TEI 模型缓存（bge-small-zh-v1.5）
