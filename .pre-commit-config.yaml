default_language_version:
  python: python3.12

# Install once per clone (hooks were missing locally — commits skipped checks):
#   pre-commit install --hook-type pre-commit --hook-type pre-push --hook-type commit-msg
# Local hooks: lint/format/secret/mypy/bandit. Pytest stays in CI only.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Run ruff from backend/ (same cwd as CI) so isort first-party matches.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (legacy alias)
        entry: uv run --no-project python scripts/run_backend_tool.py ruff check --fix
        language: system
        types: [python]
        pass_filenames: true
        files: "^backend/"
      - id: ruff-format
        name: ruff format
        entry: uv run --no-project python scripts/run_backend_tool.py ruff format
        language: system
        types: [python]
        pass_filenames: true
        files: "^backend/"

      - id: secret-scan
        name: secret-scan
        entry: uv run --no-project python scripts/secret_scan.py --staged
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run --no-project python scripts/run_backend_tool.py mypy --follow-imports=silent
        language: system
        pass_filenames: true  # ✅ 只检查改动文件
        files: '^backend/app/.*\.py$'

      - id: bandit
        name: bandit
        entry: uv run --no-project python scripts/run_backend_tool.py bandit -q -c pyproject.toml
        language: system
        pass_filenames: true  # ✅ 只检查改动文件
        files: '^backend/app/.*\.py$'

  # ✅ 改用官方 repo，避免 npx 网络问题
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - feat
          - fix
          - refactor
          - perf
          - test
          - docs
          - build
          - ci
          - chore
