[project]
name = "gameforge-backend"
version = "0.3.0"
description = "GameForge-Copilot backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "pyjwt>=2.8",
    "redis>=5.0",
    "aiosmtplib>=3.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.10",
    "langfuse>=4.14.3",
    "prometheus-client>=0.26.0",
    "aiodocker>=0.27.0",
    "aio-pika>=10.0.1",
    "boto3>=1.35",
    # zoneinfo 在 Windows 上无系统时区库，需 tzdata 提供 IANA 时区（如 Asia/Shanghai）
    "tzdata>=2024.1",
    "pyahocorasick>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.28",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "aiosqlite>=0.20",
    "fakeredis>=2.20",
    "httpx2>=2.0",
]

# 封面截图（QA 通过后用 chromium 截当前版本画面）：仅 worker 需要，不进默认依赖，
# 避免 API 进程 / 本地联调强依赖 chromium。启用：uv sync --extra playwright
[project.optional-dependencies]
playwright = [
    "playwright>=1.45",
]
e2b = [
    "e2b>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: needs real postgres/redis/docker (skipped in default CI)",
    "load: extended concurrency / stress (opt-in; not full production soak)",
]
